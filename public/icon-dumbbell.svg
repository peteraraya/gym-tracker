<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente -->
  <rect width="512" height="512" rx="115" fill="url(#gradient)"/>
  
  <!-- Definición del gradiente -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Mancuerna simplificada y más visible -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Barra central más gruesa -->
    <rect x="-140" y="-25" width="280" height="50" rx="25" fill="white"/>
    
    <!-- Disco izquierdo -->
    <rect x="-180" y="-70" width="50" height="140" rx="8" fill="white"/>
    <rect x="-170" y="-60" width="30" height="120" rx="6" fill="#E0E7FF"/>
    
    <!-- Disco derecho -->
    <rect x="130" y="-70" width="50" height="140" rx="8" fill="white"/>
    <rect x="140" y="-60" width="30" height="120" rx="6" fill="#E0E7FF"/>
    
    <!-- Detalles de agarre -->
    <g opacity="0.3">
      <rect x="-50" y="-20" width="6" height="40" rx="3" fill="#3B82F6"/>
      <rect x="-30" y="-20" width="6" height="40" rx="3" fill="#3B82F6"/>
      <rect x="-10" y="-20" width="6" height="40" rx="3" fill="#3B82F6"/>
      <rect x="10" y="-20" width="6" height="40" rx="3" fill="#3B82F6"/>
      <rect x="30" y="-20" width="6" height="40" rx="3" fill="#3B82F6"/>
      <rect x="50" y="-20" width="6" height="40" rx="3" fill="#3B82F6"/>
    </g>
    
    <!-- Brillos para efecto 3D -->
    <ellipse cx="-155" cy="-30" rx="15" ry="25" fill="white" opacity="0.5"/>
    <ellipse cx="155" cy="-30" rx="15" ry="25" fill="white" opacity="0.5"/>
    <ellipse cx="0" cy="-10" rx="60" ry="15" fill="white" opacity="0.3"/>
  </g>
</svg>
