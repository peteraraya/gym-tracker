<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512" role="img" aria-label="Imagen no disponible">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#071024" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background fills entire area to avoid white bars -->
  <rect x="0" y="0" width="1024" height="512" rx="12" fill="url(#bgGrad)" />

  <!-- Centered content with reduced margins -->
  <g transform="translate(0,0)">
    <!-- Stylized dumbbell centered -->
    <g transform="translate(288,88)" filter="url(#softShadow)">
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="448" height="192" rx="12" fill="#071022" opacity="0.06" />

        <g transform="translate(72,36)" fill="#ffffff" opacity="0.95">
          <rect x="0" y="40" width="304" height="36" rx="18" />
          <rect x="-32" y="8" width="64" height="120" rx="12" />
          <rect x="272" y="8" width="64" height="120" rx="12" />
          <rect x="72" y="12" width="56" height="96" rx="10" fill="#0b1220" />
          <rect x="176" y="12" width="56" height="96" rx="10" fill="#0b1220" />
        </g>
      </g>
    </g>

    <!-- Texto principal centrado -->
    <text x="512" y="336" text-anchor="middle" font-family="Inter, Roboto, Arial, sans-serif" font-size="44" fill="#e6edf3" font-weight="700">Imagen no disponible</text>
  </g>
</svg>