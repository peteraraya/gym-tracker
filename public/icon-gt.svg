<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente -->
  <rect width="512" height="512" rx="115" fill="url(#gradient)"/>
  
  <!-- Definición del gradiente -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    
    <!-- Sombra para texto -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Texto GT grande y visible -->
  <text 
    x="256" 
    y="340" 
    font-family="Arial, sans-serif" 
    font-size="280" 
    font-weight="900" 
    fill="white" 
    text-anchor="middle" 
    filter="url(#textShadow)"
    letter-spacing="-10"
  >GT</text>
  
  <!-- Línea decorativa superior -->
  <rect x="100" y="100" width="312" height="12" rx="6" fill="white" opacity="0.9"/>
  
  <!-- Línea decorativa inferior -->
  <rect x="100" y="400" width="312" height="12" rx="6" fill="white" opacity="0.9"/>
</svg>
