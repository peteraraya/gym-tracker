<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo con gradiente -->
  <rect width="512" height="512" rx="115" fill="url(#gradient)"/>
  
  <!-- Definición del gradiente -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Mancuerna estilizada -->
  <g transform="translate(256, 256)">
    <!-- Barra central -->
    <rect x="-120" y="-15" width="240" height="30" rx="15" fill="white"/>
    
    <!-- Disco izquierdo exterior -->
    <circle cx="-140" cy="0" r="50" fill="white" opacity="0.9"/>
    <circle cx="-140" cy="0" r="40" fill="#3B82F6"/>
    
    <!-- Disco izquierdo interior -->
    <circle cx="-120" cy="0" r="45" fill="white" opacity="0.95"/>
    <circle cx="-120" cy="0" r="35" fill="#60A5FA"/>
    
    <!-- Disco derecho interior -->
    <circle cx="120" cy="0" r="45" fill="white" opacity="0.95"/>
    <circle cx="120" cy="0" r="35" fill="#60A5FA"/>
    
    <!-- Disco derecho exterior -->
    <circle cx="140" cy="0" r="50" fill="white" opacity="0.9"/>
    <circle cx="140" cy="0" r="40" fill="#3B82F6"/>
    
    <!-- Detalles de agarre -->
    <rect x="-30" y="-12" width="3" height="24" rx="1.5" fill="#3B82F6" opacity="0.3"/>
    <rect x="-15" y="-12" width="3" height="24" rx="1.5" fill="#3B82F6" opacity="0.3"/>
    <rect x="0" y="-12" width="3" height="24" rx="1.5" fill="#3B82F6" opacity="0.3"/>
    <rect x="15" y="-12" width="3" height="24" rx="1.5" fill="#3B82F6" opacity="0.3"/>
    <rect x="30" y="-12" width="3" height="24" rx="1.5" fill="#3B82F6" opacity="0.3"/>
  </g>
  
  <!-- Texto "GT" (Gym Tracker) - opcional, puedes quitarlo si prefieres solo el icono -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">GT</text>
</svg>
