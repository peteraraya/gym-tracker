name: Build Android APK (debug)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - feature/nueva-estructura

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'

      - name: Install dependencies
        run: npm ci

      - name: Skip web build (using remote server URL)
        run: |
          echo "Skipping mobile static build because Capacitor server.url is set to remote webview."
          echo "If you want a packaged web build, remove server.url from capacitor.config.ts and restore mobile build step."

      - name: Ensure Capacitor Android platform exists and sync
        run: |
          # Ensure capacitor android runtime is available
          if [ ! -d "node_modules/@capacitor/android" ]; then
            npm i @capacitor/android@6 --no-audit --no-fund
          fi

          # If android platform is not present, try to add it (idempotent)
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            echo "Android platform not present, running: npx cap add android"
            npx cap add android || true
          else
            echo "Android platform directory exists, skipping cap add"
          fi

          # Sync native project with web assets
          npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (API 33)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
